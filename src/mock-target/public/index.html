<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperCore Admin - Host Dashboard</title>
  <link rel="preconnect" href="https://telemetry.example.invalid">
  <link rel="icon" type="image/svg+xml" href="/images/appliance-logo.svg">
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/images/appliance-logo.svg" alt="HyperCore logo" width="36" height="36">
        <div>
          <p class="brand-title">HyperCore Manager</p>
          <p class="brand-sub">v8.2 Appliance</p>
        </div>
      </div>

      <nav class="nav-list" aria-label="Primary">
        <a id="nav-dashboard" class="nav-link" href="/index.html" aria-current="page">Dashboard</a>
        <a id="nav-networking" class="nav-link" href="/networking.html">Networking Settings</a>
        <a id="nav-storage" class="nav-link" href="/storage.html">Storage Settings</a>
      </nav>

      <div class="card">
        <p class="card-label">Chassis Health</p>
        <img src="/images/rack-status.png" alt="Rack status LEDs" width="64" height="32">
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <h1 class="page-title">Host Dashboard</h1>
          <p class="page-subtitle">Dell PowerEdge R630 &middot; Serial SN-994128A</p>
        </div>
        <status-badge status="healthy" onclick="console.log('decorative-inline-handler')">esxi-prod-01.corp.local</status-badge>
      </header>

      <section class="kpi-grid" aria-label="System Metrics">
        <article class="card dynamic-adopted-accent">
          <p class="card-label">Management IPv4</p>
          <p class="card-value mono">10.24.108.42</p>
        </article>
        <article class="card">
          <p class="card-label">Primary Uplink MAC</p>
          <p class="card-value mono">00:50:56:8a:1b:2c</p>
        </article>
        <article class="card">
          <p class="card-label">Active VMs</p>
          <p class="card-value">14 Running</p>
        </article>
      </section>

      <section class="card">
        <p class="card-label">Real-Time Host Telemetry</p>
        <canvas id="telemetry-canvas" width="420" height="160" aria-label="Host telemetry chart"></canvas>
      </section>

      <section class="actions-row">
        <button type="button" id="nav-storage-btn" class="btn btn-primary">Open Storage Settings</button>
      </section>
    </main>
  </div>

  <script>window.__inlineScriptMarker = true;</script>
  <script src="/js/admin-app.js"></script>
</body>
</html>
