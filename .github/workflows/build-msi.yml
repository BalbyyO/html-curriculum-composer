name: Build and Sign Windows MSI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build application bundles
        run: npm run build

      - name: Run full unit and Playwright-Edge E2E tests
        run: npm run test

      - name: Package Windows MSI installer
        run: npm run dist:msi

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path 'release/*.msi' | Sort-Object Name
          if (-not $msiFiles) {
            throw 'No .msi artifacts found in release/'
          }
          $lines = foreach ($f in $msiFiles) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath 'release/SHA256SUMS.txt' -Encoding utf8

      - name: Upload unsigned Windows MSI artifact
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-msi
          path: |
            release/*.msi
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Submit signing request to SignPath Foundation
        id: submit-signpath
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'html-curriculum-composer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed-output

      - name: Upload signed Windows MSI artifact
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-msi
          path: ./signed-output/*
          if-no-files-found: error
